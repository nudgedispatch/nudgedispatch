# Local development and CI only.
# This config does not bind the production D1 database and must not be used to deploy.
# Production Worker: nudge-app. Production D1 name: nudge-app-db.
name = "nudge-app"
main = "app/index.js"
compatibility_date = "2026-11-08"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "nudge-app-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[vars]
SMS_MODE = "off"
BLAND_FROM_NUMBER = ""
STRIPE_PORTAL_CONFIGURATION = ""
# Stripe payment method configuration that enables only cards (pmc_...). Empty locally.
STRIPE_CARD_PAYMENT_CONFIGURATION = ""
# Signup Turnstile. Empty locally so tests skip the widget and verification.
TURNSTILE_SITE_KEY = ""
# Distance pricing (Nov 20, 2026). Our own daily caps on paid calls, all fleets together.
ROUTES_DAILY_CAP = "500"
FLIGHT_DAILY_CAP = "200"
# Public, referrer-restricted Places key for the booking page. Empty locally (plain address fields).
GOOGLE_MAPS_BROWSER_KEY = ""

# Shell scripts are .txt so Wrangler imports them as text. The Worker still
# serves them at /app.js, /sw.js, /book.js, and /book/<slug>/sw.js.
# fallthrough keeps Wrangler's built-in text rule for .html, .txt, and .sql.
[[rules]]
type = "Text"
globs = ["**/*.css", "**/*.svg", "**/*.webmanifest"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

# Flight checks for airport pickups (no-op unless FLIGHT_PROVIDER and FLIGHT_API_KEY are set;
# the older FLIGHT_DATA_PROVIDER / FLIGHT_DATA_API_KEY names still work).
[triggers]
crons = ["*/5 * * * *"]
